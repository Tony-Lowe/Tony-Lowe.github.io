{{ with resources.Get .path }}
  {{ $image := . }}
  {{ $raster := in (slice "image/jpeg" "image/png" "image/webp") $image.MediaType.Type }}
  {{ if $raster }}
    {{/* The image box is 72 × 40 CSS pixels after padding. Supply a 3× raster. */}}
    {{ $image = $image.Fit "216x120 webp q85" }}
  {{ end }}
  <div class="timeline-logo flex h-12 w-20 shrink-0 items-center justify-center rounded-lg bg-white p-1 ring-1 ring-gray-100 dark:ring-white/10">
    <img class="max-h-full max-w-full object-contain" src="{{ $image.RelPermalink }}"
         {{ if $raster }}width="{{ $image.Width }}" height="{{ $image.Height }}"{{ end }}
         loading="lazy" decoding="async" alt="{{ printf "%s logo" $.name }}">
  </div>
{{ end }}
