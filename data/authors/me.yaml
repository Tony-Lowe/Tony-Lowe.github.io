bio: |
  I am an incoming PhD student at the Institute of Computer Science (*Institut für Informatik*), Faculty of Mathematics and Computer Science, **University of Göttingen** (starting March 2027), supervised by **Prof. Dr. Alireza Modirshanechi**.

  Previously, I received my M.Eng. in Computer Science and Technology from **Nankai University** (2026), and my B.Eng. from **China University of Mining and Technology** (2023). My prior academic training focused on applied mathematics, statistical modeling, digital typography design, 3D computer graphics, and human visual perception evaluation.
