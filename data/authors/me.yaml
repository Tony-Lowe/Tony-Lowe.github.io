bio: |
  I am an incoming Doctoral Researcher at the Institute of Computer Science (*Institut für Informatik*), Georg-August-Universität Göttingen, working in the Research Group led by Prof. Dr. Alireza Modirshanechi (<https://scholar.google.ch/citations?user=ysDOYB8AAAAJ&hl=en>).

  My research focuses on mathematical and theoretical approaches to cognitive science, particularly the modeling of human learning, curiosity, surprise, and decision-making through probabilistic modeling, Bayesian statistics, and simple behavioral experiments.

  Previously, I received my M.Eng. in Computer Science and Technology from Nankai University (2026), and my B.Eng. from China University of Mining and Technology (2023). My prior academic training centered on applied mathematics, statistical modeling, digital typography design, 3D computer graphics, and human visual perception evaluation.
